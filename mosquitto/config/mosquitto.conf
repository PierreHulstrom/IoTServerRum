# Persist retained MQTT messages and client sessions across container restarts
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Enforce authentication (PBKDF2-SHA512 password file) and per-topic ACL authorization
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# External encrypted MQTTS listener for Raspberry Pi edge nodes (TLS 1.2+)
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# Internal Docker-only MQTT listener for the FastAPI backend (not mapped to host)
listener 1883
